<!DOCTYPE html>
<html>
<head>
<title>S.K Card Registration</title>
<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#1e90ff,#00c6ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    padding:25px;
    border-radius:12px;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    animation:fadeIn 1s ease-in-out;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input, select, textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#1e90ff;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#0d6efd;
}

.success{
    margin-top:10px;
    color:green;
    font-weight:bold;
    text-align:center;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>

<div class="container">
    <h2>S.K Card Registration</h2>
    
    <input type="text" id="firstName" placeholder="First Name" required>
    <input type="text" id="lastName" placeholder="Last Name" required>
    <input type="date" id="dob" required>

    <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>

    <textarea id="address" placeholder="Address" rows="3"></textarea>

    <button onclick="register()">Submit</button>

    <div class="success" id="message"></div>
</div>

<script>
function generateSKNumber(){
    let random = Math.floor(100000 + Math.random() * 900000);
    return "SK" + new Date().getFullYear() + random;
}

function register(){
    let firstName = document.getElementById("firstName").value;
    let lastName = document.getElementById("lastName").value;
    let dob = document.getElementById("dob").value;
    let gender = document.getElementById("gender").value;
    let address = document.getElementById("address").value;

    if(firstName === "" || lastName === "" || dob === "" || gender === ""){
        alert("Please fill all required fields");
        return;
    }

    let skNumber = generateSKNumber();

    let userData = {
        skCardNumber: skNumber,
        firstName: firstName,
        lastName: lastName,
        dob: dob,
        gender: gender,
        address: address
    };

    localStorage.setItem(skNumber, JSON.stringify(userData));

    document.getElementById("message").innerHTML = 
        "Registration Successful!<br>Your S.K Card No: <br><b>" + skNumber + "</b>";

    document.querySelector("form")?.reset();
}
</script>

</body>
</html>
