<!DOCTYPE html>
<html>
<head>
<title>S.K Card Login</title>
<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#1e90ff,#00c6ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    background:#fff;
    padding:25px;
    border-radius:12px;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#1e90ff;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#0d6efd;
}

.profile{
    margin-top:15px;
    font-size:18px;
    text-align:center;
}
</style>
</head>
<body>

<div class="container">
    <h2>S.K Card Login</h2>

    <input type="text" id="skNumber" placeholder="Enter S.K Number">

    <button onclick="login()">Login</button>

    <div class="profile" id="result"></div>
</div>

<script>
function login(){
    let skNumber = document.getElementById("skNumber").value;

    if(skNumber === ""){
        alert("Enter S.K Number");
        return;
    }

    let data = localStorage.getItem(skNumber);

    if(data){
        let user = JSON.parse(data);

        document.getElementById("result").innerHTML = `
            <p><b>Full Name:</b> ${user.fullName || (user.firstName + " " + user.lastName)}</p>
            <p><b>S.K Number:</b> ${user.skCardNumber}</p>
            <p><b>Date of Birth:</b> ${user.dob}</p>
        `;
    } else {
        document.getElementById("result").innerHTML =
            "<p style='color:red;'>Invalid S.K Number</p>";
    }
}
</script>

</body>
</html>
