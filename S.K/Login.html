<!DOCTYPE html>
<html>
<head>
<title>S.K Card Login</title>
<style>
body{
    font-family: Arial;
    background: linear-gradient(135deg,#1e90ff,#00c6ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    background:white;
    padding:25px;
    border-radius:12px;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
input{
    width:100%;
    padding:10px;
    margin:8px 0;
}
button{
    width:100%;
    padding:12px;
    background:#1e90ff;
    color:white;
    border:none;
}
.result{
    margin-top:15px;
    text-align:center;
}
</style>
</head>
<body>

<div class="container">
<h2>S.K Login</h2>

<input type="email" id="loginEmail" placeholder="Enter Email ID">
<input type="password" id="loginPassword" placeholder="Enter Password">

<button onclick="login()">Login</button>

<div class="result" id="result"></div>
</div>

<script>
function login(){
    let email = document.getElementById("loginEmail").value;
    let password = document.getElementById("loginPassword").value;

    let data = localStorage.getItem(email);

    if(!data){
        alert("Email not registered");
        return;
    }

    let user = JSON.parse(data);

    if(user.password !== password){
        alert("Wrong Password");
        return;
    }

    document.getElementById("result").innerHTML =
        "<b>Login Successful</b><br><br>" +
        "Full Name: " + user.firstName + " " + user.lastName + "<br>" +
        "S.K Number: " + user.skCardNumber + "<br>" +
        "Date of Birth: " + user.dob + "<br>" +
        "Email ID: " + user.email;
}
</script>

</body>
</html>
