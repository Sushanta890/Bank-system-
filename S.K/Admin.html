<!DOCTYPE html>
<html>
<head>
<title>S.K Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background: linear-gradient(135deg,#1f4037,#99f2c8);
}

.header{
    background:#1f4037;
    color:white;
    padding:15px;
    text-align:center;
    font-size:20px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    animation: fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

input, select{
    padding:8px;
    width:100%;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:#1f4037;
    color:white;
    cursor:pointer;
    margin-right:5px;
}

button:hover{
    background:#14532d;
}

.delete{
    background:red;
}
.delete:hover{
    background:darkred;
}

.edit{
    background:orange;
}
.edit:hover{
    background:darkorange;
}

.count{
    font-weight:bold;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="header">
📊 S.K Admin Panel
</div>

<div class="container">

<div class="card">
<div class="count" id="totalUsers"></div>

<input type="text" id="searchMobile" placeholder="Search by Mobile">
<button onclick="searchUser()">Search</button>
<button onclick="loadUsers()">Show All</button>
</div>

<div id="userList"></div>

</div>

<script>

let editIndex = null;

function loadUsers(){

    let users = JSON.parse(localStorage.getItem("skUsers")) || [];

    let userList = document.getElementById("userList");
    let totalUsers = document.getElementById("totalUsers");

    if(!userList || !totalUsers) return;

    userList.innerHTML = "";
    totalUsers.innerHTML = "Total Registered Users: " + users.length;

    users.forEach((user,index)=>{

        userList.innerHTML += `
            <div class="card">
                <p><b>S.K Number:</b> ${user.skNumber}</p>
                <p><b>Name:</b> ${user.fullName}</p>
                <p><b>Gender:</b> ${user.gender || "-"}</p>
                <p><b>DOB:</b> ${user.dob || "-"}</p>
                <p><b>Village/Town:</b> ${user.village || "-"}</p>
                <p><b>District:</b> ${user.district || "-"}</p>
                <p><b>State:</b> ${user.state || "-"}</p>
                <p><b>Mobile:</b> ${user.mobile}</p>
                <p><b>Email:</b> ${user.email}</p>

                <button class="edit" onclick="editUser(${index})">Edit</button>
                <button class="delete" onclick="deleteUser(${index})">Delete</button>
            </div>
        `;
    });
}

function deleteUser(index){
    let users = JSON.parse(localStorage.getItem("skUsers")) || [];
    users.splice(index,1);
    localStorage.setItem("skUsers", JSON.stringify(users));
    loadUsers();
}

function editUser(index){

    let users = JSON.parse(localStorage.getItem("skUsers")) || [];
    let user = users[index];
    editIndex = index;

    document.getElementById("userList").innerHTML = `
        <div class="card">
            <h3>Edit Full Details</h3>

            <input type="text" id="editName" value="${user.fullName}" placeholder="Full Name">

            <select id="editGender">
                <option value="Male" ${user.gender==="Male"?"selected":""}>Male</option>
                <option value="Female" ${user.gender==="Female"?"selected":""}>Female</option>
            </select>

            <input type="date" id="editDob" value="${user.dob || ""}">
            <input type="text" id="editVillage" value="${user.village || ""}" placeholder="Village/Town/City">
            <input type="text" id="editDistrict" value="${user.district || ""}" placeholder="District">
            <input type="text" id="editState" value="${user.state || ""}" placeholder="State">
            <input type="text" id="editMobile" value="${user.mobile}" placeholder="Mobile">
            <input type="email" id="editEmail" value="${user.email}" placeholder="Email">

            <button onclick="updateUser()">Update</button>
            <button onclick="loadUsers()">Cancel</button>
        </div>
    `;
}

function updateUser(){

    let users = JSON.parse(localStorage.getItem("skUsers")) || [];

    users[editIndex].fullName = document.getElementById("editName").value;
    users[editIndex].gender = document.getElementById("editGender").value;
    users[editIndex].dob = document.getElementById("editDob").value;
    users[editIndex].village = document.getElementById("editVillage").value;
    users[editIndex].district = document.getElementById("editDistrict").value;
    users[editIndex].state = document.getElementById("editState").value;
    users[editIndex].mobile = document.getElementById("editMobile").value;
    users[editIndex].email = document.getElementById("editEmail").value;

    localStorage.setItem("skUsers", JSON.stringify(users));

    editIndex = null;
    loadUsers();
}

function searchUser(){

    let search = document.getElementById("searchMobile").value.trim();
    let users = JSON.parse(localStorage.getItem("skUsers")) || [];

    let result = users.filter(user => user.mobile === search);

    let userList = document.getElementById("userList");
    userList.innerHTML = "";

    if(result.length === 0){
        userList.innerHTML = "<div class='card'>No User Found</div>";
        return;
    }

    result.forEach(user=>{
        userList.innerHTML += `
            <div class="card">
                <p><b>S.K Number:</b> ${user.skNumber}</p>
                <p><b>Name:</b> ${user.fullName}</p>
                <p><b>Gender:</b> ${user.gender || "-"}</p>
                <p><b>DOB:</b> ${user.dob || "-"}</p>
                <p><b>Village/Town:</b> ${user.village || "-"}</p>
                <p><b>District:</b> ${user.district || "-"}</p>
                <p><b>State:</b> ${user.state || "-"}</p>
                <p><b>Mobile:</b> ${user.mobile}</p>
                <p><b>Email:</b> ${user.email}</p>
            </div>
        `;
    });
}

window.onload = loadUsers;

</script>

</body>
</html>
