<!DOCTYPE html>
<html>
<head>
<title>S.K Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background: linear-gradient(135deg,#1f4037,#99f2c8);
}

.header{
    background:#1f4037;
    color:white;
    padding:15px;
    text-align:center;
    font-size:20px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    animation: fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

input{
    padding:8px;
    width:100%;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:#1f4037;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#14532d;
}

.user{
    background:#f4f4f4;
    padding:10px;
    border-radius:8px;
    margin-top:8px;
}

.delete{
    background:red;
    margin-top:5px;
}
.delete:hover{
    background:darkred;
}
.count{
    font-weight:bold;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="header">
📊 S.K Admin Panel
</div>

<div class="container">

<div class="card">
<div class="count" id="totalUsers"></div>

<input type="text" id="searchMobile" placeholder="Search by Mobile">
<button onclick="searchUser()">Search</button>
<button onclick="loadUsers()">Show All</button>
</div>

<div id="userList"></div>

</div>

<script>

function loadUsers(){

    let users = JSON.parse(localStorage.getItem("skUsers")) || [];
    document.getElementById("userList").innerHTML = "";
    document.getElementById("totalUsers").innerHTML =
        "Total Registered Users: " + users.length;

    users.forEach((user,index)=>{

        document.getElementById("userList").innerHTML += `
            <div class="card user">
                <p><b>S.K Number:</b> ${user.skNumber}</p>
                <p><b>Name:</b> ${user.fullName}</p>
                <p><b>DOB:</b> ${user.dob || "-"}</p>
                <p><b>Mobile:</b> ${user.mobile}</p>
                <p><b>Email:</b> ${user.email}</p>
                <button class="delete" onclick="deleteUser(${index})">
                Delete</button>
            </div>
        `;
    });
}

function deleteUser(index){

    let users = JSON.parse(localStorage.getItem("skUsers")) || [];
    users.splice(index,1);
    localStorage.setItem("skUsers", JSON.stringify(users));
    loadUsers();
}

function searchUser(){

    let search = document.getElementById("searchMobile").value;
    let users = JSON.parse(localStorage.getItem("skUsers")) || [];
    let result = users.filter(user => user.mobile === search);

    document.getElementById("userList").innerHTML = "";

    if(result.length === 0){
        document.getElementById("userList").innerHTML =
        "<div class='card'>No User Found</div>";
        return;
    }

    result.forEach(user=>{
        document.getElementById("userList").innerHTML += `
            <div class="card user">
                <p><b>S.K Number:</b> ${user.skNumber}</p>
                <p><b>Name:</b> ${user.fullName}</p>
                <p><b>DOB:</b> ${user.dob || "-"}</p>
                <p><b>Mobile:</b> ${user.mobile}</p>
                <p><b>Email:</b> ${user.email}</p>
            </div>
        `;
    });
}

loadUsers();

</script>

</body>
</html>
