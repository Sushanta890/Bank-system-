<!DOCTYPE html>
<html>
<head>
<title>S.K Card Registration</title>
<style>
body{
    font-family: Arial;
    background: linear-gradient(135deg,#1e90ff,#00c6ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}
.container{
    background:#fff;
    padding:25px;
    border-radius:12px;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
input, select, textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
}
button{
    width:100%;
    padding:12px;
    background:#1e90ff;
    color:white;
    border:none;
}
</style>
</head>
<body>

<div class="container">
<h2>S.K Card Registration</h2>

<form onsubmit="register(event)">
<input type="text" id="firstName" placeholder="First Name" required>
<input type="text" id="lastName" placeholder="Last Name" required>
<input type="email" id="email" placeholder="Email ID" required>
<input type="date" id="dob" required>

<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<textarea id="address" placeholder="Address"></textarea>

<input type="password" id="password" placeholder="Create Password" required>
<input type="password" id="confirmPassword" placeholder="Re-enter Password" required>

<button type="submit">Submit</button>
</form>
</div>

<script>
function generateSKNumber(){
    let random = Math.floor(100000 + Math.random() * 900000);
    return "SK" + new Date().getFullYear() + random;
}

function register(e){
    e.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if(password !== confirmPassword){
        alert("Passwords do not match");
        return;
    }

    let skNumber = generateSKNumber();

    let userData = {
        skCardNumber: skNumber,
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        email: email,
        dob: document.getElementById("dob").value,
        gender: document.getElementById("gender").value,
        address: document.getElementById("address").value,
        password: password
    };

    localStorage.setItem(email, JSON.stringify(userData));

    alert("Registration Successful!\nYour S.K Number: " + skNumber);

    window.location.href = "login.html";
}
</script>

</body>
</html>
