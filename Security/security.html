<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Security Card Registration</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#141e30,#243b55);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    width:420px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
    animation:fadeIn 0.6s ease;
}
h2{text-align:center;}
input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
}
button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#243b55;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
button:hover{background:#141e30;}
.hidden{display:none;}
.success{color:green;font-weight:bold;text-align:center;}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<div class="container">

<!-- STEP 1 -->
<div id="step1">
<h2>Registration</h2>
<input type="text" id="firstName" placeholder="First Name">
<input type="text" id="lastName" placeholder="Last Name">
<input type="date" id="dob">
<button onclick="generateSK()">Generate S.K Card</button>
</div>

<!-- STEP 2 SK -->
<div id="step2" class="hidden">
<h2>S.K Card Verification</h2>
<input type="text" id="skInput" placeholder="S.K Card Number" readonly>
<p id="skOtpText"></p>
<input type="number" id="skOtpInput" placeholder="Enter OTP">
<button onclick="verifySK()">Verify S.K OTP</button>
</div>

<!-- STEP 3 SIM -->
<div id="step3" class="hidden">
<h2>SIM Verification</h2>
<input type="text" id="simInput" placeholder="SIM Number" readonly>
<p id="simOtpText"></p>
<input type="number" id="simOtpInput" placeholder="Enter OTP">
<button onclick="verifySIM()">Verify SIM OTP</button>
</div>

<!-- STEP 4 EMAIL -->
<div id="step4" class="hidden">
<h2>Email Verification</h2>
<input type="text" id="emailInput" placeholder="Email ID" readonly>
<p id="emailOtpText"></p>
<input type="number" id="emailOtpInput" placeholder="Enter OTP">
<button onclick="verifyEmail()">Verify Email OTP</button>
</div>

<!-- SUCCESS -->
<div id="success" class="hidden">
<h2>Registration Complete</h2>
<div class="success" id="result"></div>
</div>

</div>

<script>

let userData={};
let skOTP="", simOTP="", emailOTP="";

function randomOTP(){
    return Math.floor(100000+Math.random()*900000).toString();
}

function generateSK(){

    let first=document.getElementById("firstName").value.trim();
    let last=document.getElementById("lastName").value.trim();
    let dob=document.getElementById("dob").value;

    if(!first||!last||!dob){
        alert("Fill all details");
        return;
    }

    userData.firstName=first;
    userData.lastName=last;
    userData.dob=dob;

    userData.securityCard="SEC"+Date.now().toString().slice(-6);
    userData.skNumber="SK"+Math.floor(100000+Math.random()*900000);

    document.getElementById("skInput").value=userData.skNumber;

    skOTP=randomOTP();
    document.getElementById("skOtpText").innerHTML="OTP: <b>"+skOTP+"</b>";

    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
}

function verifySK(){
    if(document.getElementById("skOtpInput").value!==skOTP){
        alert("Wrong OTP");
        return;
    }

    userData.simNumber="SIM9"+Math.floor(100000000+Math.random()*900000000);
    document.getElementById("simInput").value=userData.simNumber;

    simOTP=randomOTP();
    document.getElementById("simOtpText").innerHTML="OTP: <b>"+simOTP+"</b>";

    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step3").classList.remove("hidden");
}

function verifySIM(){
    if(document.getElementById("simOtpInput").value!==simOTP){
        alert("Wrong OTP");
        return;
    }

    userData.email=(userData.firstName+userData.lastName+"@securecard.com").toLowerCase();
    document.getElementById("emailInput").value=userData.email;

    emailOTP=randomOTP();
    document.getElementById("emailOtpText").innerHTML="OTP: <b>"+emailOTP+"</b>";

    document.getElementById("step3").classList.add("hidden");
    document.getElementById("step4").classList.remove("hidden");
}

function verifyEmail(){
    if(document.getElementById("emailOtpInput").value!==emailOTP){
        alert("Wrong OTP");
        return;
    }

    let users=JSON.parse(localStorage.getItem("securityUsers"))||[];
    users.push(userData);
    localStorage.setItem("securityUsers",JSON.stringify(users));

    document.getElementById("step4").classList.add("hidden");
    document.getElementById("success").classList.remove("hidden");

    document.getElementById("result").innerHTML=
    `
    Name: ${userData.firstName} ${userData.lastName}<br>
    DOB: ${userData.dob}<br>
    Security Card: ${userData.securityCard}<br>
    SK: ${userData.skNumber}<br>
    SIM: ${userData.simNumber}<br>
    Email: ${userData.email}
    `;
}

</script>

</body>
</html>
