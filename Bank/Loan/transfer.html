<!DOCTYPE html>
<html>

<body>
  
  <input id="from" placeholder="From">
  <input id="to" placeholder="To">
  <input id="amount" placeholder="Amount">
  
  <button onclick="transfer()">Transfer</button>
  
  <div id="ball" style="width:50px;height:50px;background:red;position:absolute;display:none;"></div>
  
  <script>
    function transfer() {
      
      let tx = JSON.parse(localStorage.getItem("skTransactions")) || [];
      
      tx.push({
        type: "Transfer",
        from: from.value,
        to: to.value,
        amount: amount.value
      });
      
      localStorage.setItem("skTransactions", JSON.stringify(tx));
      
      let ball = document.getElementById("ball");
      
      ball.style.display = "block";
      
      let pos = 0;
      
      let move = setInterval(() => {
        
        pos += 10;
        ball.style.left = pos + "px";
        
        if (pos > 300) {
          clearInterval(move);
          ball.style.display = "none";
          alert("Transfer success");
        }
        
      }, 50);
      
    }
  </script>
  
</body>

</html>
