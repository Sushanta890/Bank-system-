<!DOCTYPE html>
<html>
<head>
<title>S.K Bank Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#00c6ff,#0072ff);
margin:0;
text-align:center;
}

.card{
background:white;
padding:20px;
margin:15px;
border-radius:12px;
animation:pop 0.5s;
}

@keyframes pop{
from{transform:scale(0);}
to{transform:scale(1);}
}

button,select{
padding:10px;
margin:5px;
}

</style>
</head>
<body>

<h2>Dashboard</h2>

<div class="card" id="info"></div>

<div class="card">

<h3>Apply Loan</h3>

<select id="loanAmount">
<option value="">Amount</option>
<option value="100">100</option>
<option value="500">500</option>
<option value="1000">1000</option>
<option value="5000">5000</option>
<option value="10000">10000</option>
</select>

<select id="loanInterest">
<option value="">Interest</option>
<option value="5">5%</option>
<option value="10">10%</option>
</select>

<select id="loanMonths">
<option value="">Months</option>
<option value="3">3</option>
<option value="6">6</option>
<option value="12">12</option>
</select>

<button onclick="applyLoan()">Apply Loan</button>

</div>

<div class="card">

<button onclick="payEMI()">Pay EMI</button>

<button onclick="passbook()">Passbook</button>

<button onclick="logout()">Logout</button>

</div>

<script src="system.js"></script>

</body>
</html>
