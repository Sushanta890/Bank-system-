<!DOCTYPE html>
<html>
<head>
<title>S.K Bank Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#00c6ff);
color:white;
text-align:center;
padding-top:100px;
}

.box{
background:white;
color:black;
padding:20px;
width:300px;
margin:auto;
border-radius:15px;
}

input,button{
width:90%;
padding:10px;
margin:10px;
}

button{
background:#1e3c72;
color:white;
border:none;
}
</style>
</head>
<body>

<div class="box">
<h2>S.K Bank Login</h2>

<input type="text" id="account" placeholder="Account Number">

<input type="text" id="mobile" placeholder="Mobile Number">

<button onclick="login()">Login</button>

<button onclick="adminLogin()">Admin Login</button>

</div>

<script src="system.js"></script>

</body>
</html>
