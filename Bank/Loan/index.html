<!DOCTYPE html>
<html>
<head>
<title>S.K Bank Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#00c6ff);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:white;
padding:25px;
border-radius:15px;
width:320px;
text-align:center;
animation:fade 1s;
}

@keyframes fade{
from{opacity:0; transform:translateY(30px);}
to{opacity:1;}
}

input,button{
width:90%;
padding:10px;
margin:10px;
}

button{
background:#1e3c72;
color:white;
border:none;
cursor:pointer;
}
</style>
</head>
<body>

<div class="box">

<h2>S.K Bank Login</h2>

<input id="account" placeholder="Account Number">

<input id="mobile" placeholder="Mobile Number">

<button onclick="login()">Login</button>

<button onclick="adminLogin()">Admin</button>

</div>

<script src="system.js"></script>

</body>
</html>
