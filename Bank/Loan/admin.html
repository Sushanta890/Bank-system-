<!DOCTYPE html>
<html>

<body>
  
  <h2>Admin Panel</h2>
  
  <div id="loans"></div>
  
  <script>
    let loans = JSON.parse(localStorage.getItem("skLoans")) || [];
    let users = JSON.parse(localStorage.getItem("skUsers")) || [];
    let tx = JSON.parse(localStorage.getItem("skTransactions")) || [];
    let notes = JSON.parse(localStorage.getItem("skNotifications")) || [];
    
    let html = "";
    
    loans.forEach((loan, i) => {
      
      html += `
Account:${loan.account}
Amount:${loan.amount}
Status:${loan.status}

<button onclick="approve(${i})">Approve</button>
<button onclick="reject(${i})">Reject</button>
<br><hr>
`;
      
    });
    
    loansDiv.innerHTML = html;
    
    function approve(i) {
      
      loans[i].status = "Approved";
      
      tx.push({
        type: "Loan",
        account: loans[i].account,
        amount: loans[i].amount
      });
      
      notes.push({
        message: "Loan approved:" + loans[i].account,
        date: new Date().toLocaleString()
      });
      
      localStorage.setItem("skLoans", JSON.stringify(loans));
      localStorage.setItem("skTransactions", JSON.stringify(tx));
      localStorage.setItem("skNotifications", JSON.stringify(notes));
      
      location.reload();
      
    }
    
    function reject(i) {
      
      loans[i].status = "Rejected";
      
      localStorage.setItem("skLoans", JSON.stringify(loans));
      
      location.reload();
      
    }
  </script>
  
</body>

</html>
