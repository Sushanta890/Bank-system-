<!DOCTYPE html>
<html>
<head>
<title>S.K Bank Login</title>
<style>
body{
font-family:Arial;
background:#1e3c72;
color:white;
text-align:center;
padding-top:100px;
}
.box{
background:white;
color:black;
width:350px;
margin:auto;
padding:20px;
border-radius:10px;
animation:fade 1s;
}
input,button{
width:90%;
padding:10px;
margin:5px;
}
button{
background:#1e3c72;
color:white;
border:none;
}
@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>
<body>

<h2>S.K Bank Login</h2>

<div class="box">

<input type="text" id="mobile" placeholder="Mobile Number">

<input type="text" id="account" placeholder="Account Number">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

let mobile=document.getElementById("mobile").value;
let account=document.getElementById("account").value;

let users=JSON.parse(localStorage.getItem("skUsers"))||[];

let user=users.find(u=>u.mobile==mobile && u.account==account);

if(user){

localStorage.setItem("loggedUser",JSON.stringify(user));

window.location="home.html";

}

else{

alert("Invalid login");

}

}

</script>

</body>
</html>
