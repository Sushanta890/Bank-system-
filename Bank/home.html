<!DOCTYPE html>
<html>
<head>
<title>S.K Bank Home</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.card{
background:white;
color:black;
width:350px;
margin:auto;
padding:20px;
border-radius:10px;
animation:fade 1s;
}

button{
padding:10px;
margin:5px;
background:#1e3c72;
color:white;
border:none;
}

</style>

</head>
<body>

<h2>S.K Bank Dashboard</h2>

<div class="card" id="profile"></div>

<button onclick="transferPage()">Transfer Balance</button>

<button onclick="window.location='atm.html'">ATM Card</button>

<button onclick="generateQR()">Generate QR</button>

<button onclick="showHistory()">Transactions</button>

<div id="qr"></div>

<div id="history"></div>

<script>

let user=JSON.parse(localStorage.getItem("loggedUser"));

let users=JSON.parse(localStorage.getItem("skUsers"))||[];

let current=users.find(u=>u.account==user.account);

if(!current.balance) current.balance=0;

document.getElementById("profile").innerHTML=`

Name: ${current.fname} ${current.lname}<br>

Gender: ${current.gender}<br>

DOB: ${current.dob}<br>

Email: ${current.email}<br>

Account: ${current.account}<br>

Customer ID: ${current.customerId}<br>

Balance: ₹${current.balance}

`;


// Transfer
function transferPage(){

let to=prompt("Enter Transfer Account Number");

let amount=parseFloat(prompt("Enter Amount"));

let receiver=users.find(u=>u.account==to);

if(!receiver){

alert("Account not found");

return;

}

if(current.balance<amount){

alert("Insufficient balance");

return;

}

current.balance-=amount;

receiver.balance=(receiver.balance||0)+amount;


// save history

let history=JSON.parse(localStorage.getItem("skHistory"))||[];

history.push({

from:current.account,

to:receiver.account,

amount:amount,

date:new Date().toLocaleString()

});

localStorage.setItem("skHistory",JSON.stringify(history));

localStorage.setItem("skUsers",JSON.stringify(users));

alert("Transfer successful");

location.reload();

}


// QR
function generateQR(){

document.getElementById("qr").innerHTML="";

QRCode.toCanvas(current.account,function(err,canvas){

document.getElementById("qr").appendChild(canvas);

});

}


// History
function showHistory(){

let history=JSON.parse(localStorage.getItem("skHistory"))||[];

let html="<h3>Transactions</h3>";

history.forEach(h=>{

if(h.from==current.account || h.to==current.account){

html+=`

From: ${h.from}<br>

To: ${h.to}<br>

Amount: ₹${h.amount}<br>

Date: ${h.date}<br><hr>

`;

}

});

document.getElementById("history").innerHTML=html;

}

</script>

</body>
</html>
