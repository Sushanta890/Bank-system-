<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.K Bank - Home</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(to right,#00c6ff,#0072ff);
    color:white;
    text-align:center;
}

/* Header */
header{
    background:rgba(0,0,0,0.3);
    padding:20px;
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
}

/* Card */
.container{
    margin-top:40px;
}

.card{
    background:white;
    color:black;
    margin:20px auto;
    padding:20px;
    width:90%;
    max-width:400px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
    animation:fadeIn 1s;
}

/* Buttons */
button{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(to right,#0072ff,#00c6ff);
    color:white;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Footer */
footer{
    margin-top:40px;
    padding:10px;
    background:rgba(0,0,0,0.3);
}

/* Animation */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>

</head>
<body>

<header>
🏦 S.K BANK
</header>

<div class="container">

<div class="card">
<h2>Welcome to S.K Bank</h2>

<button onclick="openPage('open-account.html')">Open Account</button>

<button onclick="openPage('balance.html')">Balance Check</button>

<button onclick="openPage('deposit.html')">Deposit Money</button>

<button onclick="openPage('withdraw.html')">Withdraw Money</button>

<button onclick="openPage('transaction.html')">Transaction History</button>

</div>

</div>

<footer>
© 2026 S.K Bank | Secure Banking System
</footer>

<script>
function openPage(page){
    window.location.href = page;
}
</script>

</body>
</html>
