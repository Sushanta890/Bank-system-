<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>S.K Bank Transaction History</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: Arial;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
    text-align:center;
}

.container{
    background:white;
    color:black;
    width:95%;
    max-width:1000px;
    margin:auto;
    padding:20px;
    border-radius:12px;
}

input,button{
    padding:10px;
    margin:5px;
}

button{
    background:#1e3c72;
    color:white;
    border:none;
}

canvas{
    background:white;
    margin-top:20px;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th,td{
    border:1px solid black;
    padding:8px;
}

th{
    background:#1e3c72;
    color:white;
}
</style>
</head>

<body>

<h2>S.K Bank Transaction History</h2>

<div class="container">

<input type="text" id="accountInput" placeholder="Enter Account Number">
<button onclick="loadTransactions()">Show History</button>

<h3 id="balanceShow"></h3>

<table>
<thead>
<tr>
<th>Date</th>
<th>Type</th>
<th>Amount</th>
<th>Balance</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<canvas id="pieChart"></canvas>
<canvas id="barChart"></canvas>
<canvas id="lineChart"></canvas>

</div>

<script>

// MAIN FUNCTION
function loadTransactions(){

let account = document.getElementById("accountInput").value.trim();

let users = JSON.parse(localStorage.getItem("skUsers")) || [];

let transactions = JSON.parse(localStorage.getItem("skTransactions")) || [];

// FIND USER
let user = users.find(u=>u.account===account);

if(!user){

alert("Account not found");

return;

}

// SHOW BALANCE
document.getElementById("balanceShow").innerHTML =
"Current Balance: ₹"+(user.balance || 0);


// FILTER TRANSACTIONS
let filtered = transactions.filter(t=>t.account===account);

if(filtered.length===0){

alert("No transactions found");

return;

}

// SHOW TABLE
let tbody = document.getElementById("tbody");

tbody.innerHTML="";

filtered.forEach(t=>{

tbody.innerHTML += `
<tr>
<td>${t.date}</td>
<td>${t.type}</td>
<td>₹${t.amount}</td>
<td>₹${t.balance}</td>
</tr>
`;

});

// LOAD CHARTS
loadCharts(filtered);

}


// CHART FUNCTION
function loadCharts(data){

let labels = data.map(d=>d.date);

let amounts = data.map(d=>d.amount);


// PIE
new Chart(pieChart,{
type:"pie",
data:{
labels:labels,
datasets:[{data:amounts}]
}
});


// BAR
new Chart(barChart,{
type:"bar",
data:{
labels:labels,
datasets:[{
label:"Transactions",
data:amounts
}]
}
});


// LINE
new Chart(lineChart,{
type:"line",
data:{
labels:labels,
datasets:[{
label:"Balance Flow",
data:amounts
}]
}
});

}

</script>

</body>
</html>
