<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>S.K Bank Transaction History</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
text-align:center;
}

.container{
background:white;
color:black;
width:95%;
max-width:1100px;
margin:auto;
padding:20px;
border-radius:12px;
animation:fadeIn 1s;
}

input,button{
padding:10px;
margin:5px;
}

button{
background:#1e3c72;
color:white;
border:none;
cursor:pointer;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
border:1px solid black;
padding:8px;
}

th{
background:#1e3c72;
color:white;
}

canvas{
background:white;
margin-top:20px;
max-height:300px;
}

@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}

</style>

</head>

<body>

<h2>S.K Bank Transaction History</h2>

<div class="container">

<input type="text" id="accountNumber" placeholder="Enter Account Number">

<button onclick="loadHistory()">Show History</button>

<h3 id="nameText"></h3>

<h3 id="balanceText"></h3>

<table>

<thead>
<tr>
<th>Date & Time</th>
<th>Type</th>
<th>Amount</th>
<th>Balance</th>
</tr>
</thead>

<tbody id="historyBody"></tbody>

</table>


<h3>Pie Chart</h3>
<canvas id="pieChart"></canvas>

<h3>Donut Chart</h3>
<canvas id="donutChart"></canvas>

<h3>Column Chart</h3>
<canvas id="barChart"></canvas>

<h3>Clustered Column Chart</h3>
<canvas id="clusterChart"></canvas>

<h3>Statistics Chart</h3>
<canvas id="statsChart"></canvas>

<h3>Gauge Chart</h3>
<canvas id="gaugeChart"></canvas>

<h3>Balance Line Chart</h3>
<canvas id="lineChart"></canvas>

</div>

<script>

let pieChart, donutChart, barChart, clusterChart, statsChart, gaugeChart, lineChart;


// LOAD HISTORY
function loadHistory(){

let acc=document.getElementById("accountNumber").value.trim();

let users=JSON.parse(localStorage.getItem("skUsers"))||[];

let transactions=JSON.parse(localStorage.getItem("skTransactions"))||[];

let user=users.find(u=>u.account===acc);

if(!user){

alert("Account not found");
return;

}


// SHOW NAME
document.getElementById("nameText").innerHTML=
"Account Holder: "+user.fname+" "+user.lname;


// SHOW BALANCE
document.getElementById("balanceText").innerHTML=
"Current Balance: ₹"+(user.balance||0);


// FILTER TRANSACTIONS
let data=transactions.filter(t=>t.account===acc);

if(data.length===0){

alert("No transactions found");
return;

}


// SHOW TABLE
let body=document.getElementById("historyBody");

body.innerHTML="";

data.forEach(t=>{

body.innerHTML+=`
<tr>
<td>${t.date}</td>
<td>${t.type}</td>
<td>₹${t.amount}</td>
<td>₹${t.balance}</td>
</tr>
`;

});


// CREATE CHARTS
createCharts(data,user.balance);

}



// CREATE ALL CHARTS
function createCharts(data,currentBalance){

let labels=data.map(t=>t.date);

let amounts=data.map(t=>t.amount);

let balances=data.map(t=>t.balance);


// DESTROY OLD
if(pieChart) pieChart.destroy();
if(donutChart) donutChart.destroy();
if(barChart) barChart.destroy();
if(clusterChart) clusterChart.destroy();
if(statsChart) statsChart.destroy();
if(gaugeChart) gaugeChart.destroy();
if(lineChart) lineChart.destroy();


// PIE CHART
pieChart=new Chart(pieChartCanvas(),{
type:"pie",
data:{
labels:labels,
datasets:[{
data:amounts
}]
}
});


// DONUT CHART
donutChart=new Chart(donutChartCanvas(),{
type:"doughnut",
data:{
labels:labels,
datasets:[{
data:amounts
}]
}
});


// COLUMN CHART
barChart=new Chart(barChartCanvas(),{
type:"bar",
data:{
labels:labels,
datasets:[{
label:"Transactions",
data:amounts
}]
}
});


// CLUSTERED COLUMN
clusterChart=new Chart(clusterChartCanvas(),{
type:"bar",
data:{
labels:labels,
datasets:[
{
label:"Amount",
data:amounts
},
{
label:"Balance",
data:balances
}
]
}
});


// STATISTICS CHART
let total=amounts.reduce((a,b)=>a+b,0);

let avg=total/amounts.length;

statsChart=new Chart(statsChartCanvas(),{
type:"bar",
data:{
labels:["Total","Average"],
datasets:[{
data:[total,avg]
}]
}
});


// GAUGE CHART
gaugeChart=new Chart(gaugeChartCanvas(),{
type:"doughnut",
data:{
labels:["Balance","Remaining"],
datasets:[{
data:[currentBalance,100000-currentBalance]
}]
}
});


// LINE CHART
lineChart=new Chart(lineChartCanvas(),{
type:"line",
data:{
labels:labels,
datasets:[{
label:"Balance Growth",
data:balances,
fill:true
}]
}
});

}


// CANVAS FUNCTIONS
function pieChartCanvas(){return document.getElementById("pieChart");}
function donutChartCanvas(){return document.getElementById("donutChart");}
function barChartCanvas(){return document.getElementById("barChart");}
function clusterChartCanvas(){return document.getElementById("clusterChart");}
function statsChartCanvas(){return document.getElementById("statsChart");}
function gaugeChartCanvas(){return document.getElementById("gaugeChart");}
function lineChartCanvas(){return document.getElementById("lineChart");}


</script>

</body>
</html>
