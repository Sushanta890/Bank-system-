<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>S.K Bank Deposit</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
text-align:center;
}

.container{
background:white;
color:black;
width:350px;
margin:auto;
padding:20px;
border-radius:10px;
margin-top:30px;
animation:fadeIn 0.8s;
}

input,button{
padding:10px;
margin:5px;
width:90%;
}

button{
background:#1e3c72;
color:white;
border:none;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#2a5298;
}

canvas{
background:white;
margin-top:20px;
border-radius:10px;
}

.success{
color:green;
font-weight:bold;
animation:fadeIn 0.5s;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

</style>

</head>
<body>

<h2>S.K Bank Deposit System</h2>

<div class="container">

<input type="text" id="accountNumber" placeholder="Enter Account Number">

<input type="text" id="name" placeholder="Enter Name">

<input type="number" id="amount" placeholder="Enter Amount">

<button onclick="depositMoney()">Deposit</button>

<h3 id="result"></h3>

</div>

<canvas id="chart"></canvas>

<script>

let chart;


// DEPOSIT FUNCTION
function depositMoney(){

let acc=document.getElementById("accountNumber").value.trim();

let name=document.getElementById("name").value.trim();

let amount=parseFloat(document.getElementById("amount").value);


// VALIDATION
if(acc=="" || name=="" || isNaN(amount) || amount<=0){

alert("Enter valid details");

return;

}


// LOAD USERS
let users=JSON.parse(localStorage.getItem("skUsers")) || [];


// FIND USER
let user=users.find(u=>u.account===acc);


if(!user){

alert("Account not found");

return;

}


// INITIAL BALANCE
if(!user.balance){

user.balance=0;

}


// ADD BALANCE
user.balance += amount;


// SAVE USERS
localStorage.setItem("skUsers",JSON.stringify(users));


// SAVE TRANSACTION HISTORY
let transactions = JSON.parse(localStorage.getItem("skTransactions")) || [];

transactions.push({

account: user.account,
name: name,
type: "Deposit",
amount: amount,
balance: user.balance,
date: new Date().toLocaleString()

});

localStorage.setItem("skTransactions", JSON.stringify(transactions));


// SHOW RESULT
document.getElementById("result").innerHTML=
"<span class='success'>Deposit Successful ✔<br>New Balance: ₹"+user.balance+"</span>";


// CLEAR INPUT FIELDS AUTOMATICALLY
document.getElementById("accountNumber").value="";
document.getElementById("name").value="";
document.getElementById("amount").value="";


// UPDATE CHART
loadChart(user.account);

}


// LOAD CHART
function loadChart(acc){

let transactions = JSON.parse(localStorage.getItem("skTransactions")) || [];

let data = transactions.filter(t=>t.account===acc);

let labels=data.map(t=>t.date);

let amounts=data.map(t=>t.balance);


// DESTROY OLD CHART
if(chart){
chart.destroy();
}


// CREATE NEW CHART
chart = new Chart(document.getElementById("chart"),{

type:"line",

data:{

labels:labels,

datasets:[{

label:"Balance Growth",

data:amounts,

borderColor:"green",

backgroundColor:"rgba(0,255,0,0.2)",

fill:true,

tension:0.4

}]

},

options:{
animation:{
duration:1000
}
}

});

}

</script>

</body>
</html>
