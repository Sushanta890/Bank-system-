<!DOCTYPE html>
<html>
<head>
<title>S.K Bank Registration</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
text-align:center;
padding-top:40px;
}

form{
background:white;
color:black;
width:350px;
margin:auto;
padding:20px;
border-radius:12px;
}

input, select{
width:90%;
padding:10px;
margin:6px;
}

button{
background:#1e3c72;
color:white;
padding:10px;
border:none;
cursor:pointer;
width:95%;
}
</style>
</head>
<body>

<h2>S.K Bank Account Registration</h2>

<form onsubmit="register(event)">

<input type="text" id="fname" placeholder="First Name" required>
<input type="text" id="lname" placeholder="Last Name" required>
<input type="date" id="dob" required>

<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<input type="email" id="email" placeholder="Email" required>

<input type="tel" id="mobile" placeholder="Mobile Number"
pattern="[0-9]{10}" required>

<button type="submit">Create Account</button>

</form>

<script>

// GENERATE UNIQUE ACCOUNT NUMBER
function generateAccount(users){

let account;

do{
account="SK"+Math.floor(100000000 + Math.random()*900000000);
}
while(users.some(u=>u.account===account));

return account;

}


// GENERATE UNIQUE CUSTOMER ID
function generateCustomerID(users){

let customerID;

do{
customerID="CUST"+Math.floor(10000 + Math.random()*90000);
}
while(users.some(u=>u.customerID===customerID));

return customerID;

}


// REGISTER FUNCTION
function register(e){

e.preventDefault();

let users = JSON.parse(localStorage.getItem("skUsers")) || [];
let transactions = JSON.parse(localStorage.getItem("skTransactions")) || [];
let notifications = JSON.parse(localStorage.getItem("skNotifications")) || [];

let mobile=document.getElementById("mobile").value;


// CHECK DUPLICATE MOBILE
if(users.find(u=>u.mobile===mobile)){

alert("Mobile already registered");
return;

}


// GENERATE UNIQUE VALUES
let account=generateAccount(users);

let customerID=generateCustomerID(users);


// CREATE USER
let user={

fname:fname.value,
lname:lname.value,
dob:dob.value,
gender:gender.value,
email:email.value,
mobile:mobile,

account:account,
customerID:customerID,

balance:0,
blocked:false,
loanActive:false,

status:"Pending",

created:new Date().toLocaleString()

};


// SAVE USER
users.push(user);


// SAVE TRANSACTION
transactions.push({

type:"Account Created",
account:account,
amount:0,
balance:0,
date:new Date().toLocaleString()

});


// SAVE NOTIFICATION
notifications.push({

message:"New account pending approval: "+account,
date:new Date().toLocaleString()

});


// SAVE STORAGE
localStorage.setItem("skUsers",JSON.stringify(users));
localStorage.setItem("skTransactions",JSON.stringify(transactions));
localStorage.setItem("skNotifications",JSON.stringify(notifications));


// SUCCESS MESSAGE
alert(
"Account Created Successfully\n\n"+
"Account Number: "+account+"\n"+
"Customer ID: "+customerID+"\n\n"+
"Status: Pending Approval"
);


// REDIRECT
location.href="home.html";

}

</script>

</body>
</html>
