<!DOCTYPE html>
<html>
<head>
    <title>S.K Bank Registration</title>
    <style>
        body { 
            font-family: Arial; 
            background: #1e3c72; 
            color: white; 
            text-align: center; 
            padding-top: 50px; 
        }
        form { 
            background: white; 
            color: black; 
            width: 350px; 
            padding: 20px; 
            margin: auto; 
            border-radius: 12px; 
        }
        input, select { 
            width: 90%; 
            padding: 8px; 
            margin: 5px; 
        }
        button { 
            padding: 10px; 
            background: #1e3c72; 
            color: white; 
            border: none; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

<h2>S.K Bank Registration</h2>

<form onsubmit="register(event)">
    <input type="text" id="fname" placeholder="First Name" required><br>
    <input type="text" id="lname" placeholder="Last Name" required><br>
    <input type="date" id="dob" required><br>
    <select id="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
    </select><br>
    <input type="email" id="email" placeholder="Email" required><br>
    <input type="tel" id="mobile" placeholder="Mobile Number" required pattern="\d{10}" title="Enter a 10-digit mobile number"><br>
    <button type="submit">Register</button>
</form>

<script>
function generateAccountNumber(){
    return "SK"+Math.floor(100000000 + Math.random()*900000000);
}

function generateCustomerID(){
    return "CUST"+Math.floor(10000 + Math.random()*90000);
}

function generateAddress(){
    const streets = ["Main Road","Temple Street","Station Road","Lake View","Market Area"];
    const cities = ["Bhubaneswar","Cuttack","Puri","Delhi","Mumbai"];
    return Math.floor(Math.random()*100) + ", " + 
           streets[Math.floor(Math.random()*streets.length)] + ", " + 
           cities[Math.floor(Math.random()*cities.length)];
}

function register(event){
    event.preventDefault();

    let users = JSON.parse(localStorage.getItem("skUsers")) || [];

    const mobileInput = document.getElementById("mobile").value.trim();

    // Validate 10-digit mobile
    if(!/^\d{10}$/.test(mobileInput)){
        alert("Mobile number must be exactly 10 digits!");
        return;
    }

    // Check duplicate mobile
    const existing = users.find(u => u.mobile === mobileInput);
    if(existing){
        alert("Mobile number already registered!");
        return;
    }

    const user = {
        fname: document.getElementById("fname").value,
        lname: document.getElementById("lname").value,
        dob: document.getElementById("dob").value,
        gender: document.getElementById("gender").value,
        email: document.getElementById("email").value,
        mobile: mobileInput,
        account: generateAccountNumber(),
        customerId: generateCustomerID(),
        address: generateAddress(),
        status: "Pending" // Pending approval
    };

    users.push(user);
    localStorage.setItem("skUsers", JSON.stringify(users));

    alert("Registration submitted! Waiting for approval.");
    location.reload();
}
</script>

</body>
</html>
