<!DOCTYPE html>
<html>
<head>
<title>S.K Bank Admin Approval</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
font-family:Arial;
background:#243b55;
color:white;
text-align:center;
padding:20px;
}

table{
width:95%;
margin:auto;
border-collapse:collapse;
background:white;
color:black;
}

th,td{
padding:10px;
border:1px solid black;
}

th{
background:#1e3c72;
color:white;
}

button{
padding:6px 12px;
background:#1e3c72;
color:white;
border:none;
cursor:pointer;
}
</style>
</head>

<body>

<h2>Admin Approval Dashboard</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>Account Number</th>
<th>Customer ID</th>
<th>Status</th>
<th>Approved At</th>
<th>Action</th>
</tr>
</thead>

<tbody id="userTable"></tbody>

</table>

<script>

function loadUsers(){

let users=JSON.parse(localStorage.getItem("skUsers"))||[];

let tbody=document.getElementById("userTable");

tbody.innerHTML="";

users.forEach((u,i)=>{

tbody.innerHTML+=`

<tr>

<td>${u.fname} ${u.lname}</td>

<td>${u.mobile}</td>

<td>${u.account}</td>

<td>${u.customerID}</td>

<td>${u.status}</td>

<td>${u.approvedAt || "-"}</td>

<td>

${u.status==="Pending"?
`<button onclick="approve(${i})">Approve</button>`:
"Approved"}

</td>

</tr>

`;

});

}


function approve(index){

let users=JSON.parse(localStorage.getItem("skUsers"));

users[index].status="Approved";

users[index].approvedAt=new Date().toLocaleString();

localStorage.setItem("skUsers",JSON.stringify(users));

loadUsers();

}


loadUsers();

</script>

</body>
</html>
