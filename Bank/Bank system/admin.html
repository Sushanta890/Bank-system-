<!DOCTYPE html>
<html>
<head>
    <title>S.K Bank Admin Approval</title>
    <style>
        body{ font-family: Arial; background: #243b55; color: white; text-align: center; padding: 20px; }
        table { width: 90%; margin: auto; border-collapse: collapse; color: black; background: white; }
        th, td { padding: 10px; border: 1px solid black; }
        button{ padding: 5px 10px; background: #243b55; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<h2>Admin Approval Dashboard</h2>

<table>
    <thead>
        <tr>
            <th>Name</th><th>Mobile</th><th>Status</th><th>Action</th>
        </tr>
    </thead>
    <tbody id="userTable"></tbody>
</table>

<script>
function loadUsers(){
    const users = JSON.parse(localStorage.getItem("skUsers")) || [];
    const tbody = document.getElementById("userTable");
    tbody.innerHTML = "";
    users.forEach((u,i)=>{
        const row = document.createElement("tr");
        row.innerHTML = `<td>${u.fname} ${u.lname}</td>
                         <td>${u.mobile}</td>
                         <td>${u.status}</td>
                         <td>${u.status==="Pending"?`<button onclick="approve(${i})">Approve</button>`:"Approved"}</td>`;
        tbody.appendChild(row);
    });
}

function approve(index){
    let users = JSON.parse(localStorage.getItem("skUsers"));
    users[index].status = "Approved";
    localStorage.setItem("skUsers", JSON.stringify(users));
    loadUsers();
}

loadUsers();
</script>

</body>
</html>
