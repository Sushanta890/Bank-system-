<!DOCTYPE html>
<html>
<head>
<title>S.K Bank Advanced Chart Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.header{
background:#1e3c72;
padding:15px;
font-size:20px;
}

.chart-box{
width:45%;
display:inline-block;
background:white;
color:black;
margin:10px;
padding:15px;
border-radius:10px;
}

.info{
background:white;
color:black;
width:300px;
margin:auto;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

</style>

</head>
<body>

<div class="header">
S.K Bank Advanced Chart Dashboard
</div>

<div class="info" id="userInfo"></div>

<div class="chart-box"><canvas id="columnChart"></canvas></div>
<div class="chart-box"><canvas id="clusterColumnChart"></canvas></div>
<div class="chart-box"><canvas id="stackedColumnChart"></canvas></div>
<div class="chart-box"><canvas id="barChart"></canvas></div>
<div class="chart-box"><canvas id="stackedBarChart"></canvas></div>
<div class="chart-box"><canvas id="areaChart"></canvas></div>
<div class="chart-box"><canvas id="donutChart"></canvas></div>
<div class="chart-box"><canvas id="pieChart"></canvas></div>
<div class="chart-box"><canvas id="histogramChart"></canvas></div>
<div class="chart-box"><canvas id="gaugeChart"></canvas></div>
<div class="chart-box"><canvas id="liveChart"></canvas></div>

<script>

// LOAD USER
let loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
let users = JSON.parse(localStorage.getItem("skUsers")) || [];
let transactions = JSON.parse(localStorage.getItem("skTransactions")) || [];

let current = users.find(u=>u.account===loggedUser.account);

document.getElementById("userInfo").innerHTML=
`
Name: ${current.fname} ${current.lname}<br>
Account: ${current.account}<br>
Balance: ₹${current.balance || 0}
`;


// FILTER USER TRANSACTIONS
let userTx = transactions.filter(t=>t.account===current.account);


// COUNT TYPES
let deposit=0, withdraw=0, transfer=0;

userTx.forEach(t=>{
if(t.type.includes("Deposit")) deposit+=t.amount;
if(t.type.includes("Withdraw")) withdraw+=t.amount;
if(t.type.includes("Transfer")) transfer+=t.amount;
});


// LABELS
let labels=userTx.map(t=>t.date);
let amounts=userTx.map(t=>t.amount);
let balances=userTx.map(t=>t.balance);


// COLUMN CHART
new Chart(columnChart,{
type:'bar',
data:{
labels:labels,
datasets:[{
label:'Transaction Amount',
data:amounts,
backgroundColor:'green'
}]
}
});


// CLUSTERED COLUMN
new Chart(clusterColumnChart,{
type:'bar',
data:{
labels:["Deposit","Withdraw","Transfer"],
datasets:[{
label:'Amount',
data:[deposit,withdraw,transfer],
backgroundColor:['green','red','blue']
}]
}
});


// STACKED COLUMN
new Chart(stackedColumnChart,{
type:'bar',
data:{
labels:["Transactions"],
datasets:[
{
label:'Deposit',
data:[deposit],
backgroundColor:'green'
},
{
label:'Withdraw',
data:[withdraw],
backgroundColor:'red'
},
{
label:'Transfer',
data:[transfer],
backgroundColor:'blue'
}
]
},
options:{
scales:{x:{stacked:true},y:{stacked:true}}
}
});


// BAR CHART
new Chart(barChart,{
type:'bar',
data:{
labels:["Deposit","Withdraw","Transfer"],
datasets:[{
data:[deposit,withdraw,transfer],
backgroundColor:['green','red','blue']
}]
},
options:{indexAxis:'y'}
});


// STACKED BAR
new Chart(stackedBarChart,{
type:'bar',
data:{
labels:["Total"],
datasets:[
{label:'Deposit',data:[deposit],backgroundColor:'green'},
{label:'Withdraw',data:[withdraw],backgroundColor:'red'},
{label:'Transfer',data:[transfer],backgroundColor:'blue'}
]
},
options:{
indexAxis:'y',
scales:{x:{stacked:true},y:{stacked:true}}
}
});


// AREA CHART
new Chart(areaChart,{
type:'line',
data:{
labels:labels,
datasets:[{
label:'Balance',
data:balances,
fill:true,
backgroundColor:'rgba(0,255,0,0.3)',
borderColor:'green'
}]
}
});


// DONUT
new Chart(donutChart,{
type:'doughnut',
data:{
labels:["Deposit","Withdraw","Transfer"],
datasets:[{
data:[deposit,withdraw,transfer],
backgroundColor:['green','red','blue']
}]
}
});


// PIE
new Chart(pieChart,{
type:'pie',
data:{
labels:["Deposit","Withdraw","Transfer"],
datasets:[{
data:[deposit,withdraw,transfer],
backgroundColor:['green','red','blue']
}]
}
});


// HISTOGRAM
new Chart(histogramChart,{
type:'bar',
data:{
labels:amounts,
datasets:[{
label:'Amount Distribution',
data:amounts,
backgroundColor:'orange'
}]
}
});


// GAUGE CHART
let balance=current.balance || 0;
let max=100000;

new Chart(gaugeChart,{
type:'doughnut',
data:{
labels:["Balance","Remaining"],
datasets:[{
data:[balance,max-balance],
backgroundColor:['green','gray']
}]
},
options:{
rotation:270,
circumference:180
}
});


// LIVE CHART
let liveLabels=[];
let liveData=[];

let liveChartObj=new Chart(liveChart,{
type:'line',
data:{
labels:liveLabels,
datasets:[{
label:'Live Transaction',
data:liveData,
borderColor:'cyan'
}]
}
});

setInterval(()=>{

let time=new Date().toLocaleTimeString();

liveLabels.push(time);
liveData.push(Math.floor(Math.random()*balance));

if(liveLabels.length>10){
liveLabels.shift();
liveData.shift();
}

liveChartObj.update();

},2000);

</script>

</body>
</html>
