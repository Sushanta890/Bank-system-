<!DOCTYPE html>
<html>

<head>
  <title>S.K Bank Auto Chart Dashboard</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
    }
    
    /* HEADER */
    .header {
      background: #1e3c72;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
    }
    
    /* USER INFO */
    .info {
      background: white;
      color: black;
      width: 300px;
      margin: 15px auto;
      padding: 10px;
      border-radius: 10px;
    }
    
    /* CENTER SCREEN CHART CONTAINER */
    .chart-container {
      
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      
      width: 85%;
      max-width: 600px;
      height: 350px;
      
      background: white;
      border-radius: 15px;
      padding: 15px;
      
      display: none;
      
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
      
      animation: fadeZoom 0.5s;
    }
    
    /* ACTIVE CHART */
    .chart-container.active {
      display: block;
    }
    
    /* CANVAS */
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
    
    /* ANIMATION */
    @keyframes fadeZoom {
      
      from {
        opacity: 0;
        transform: translate(-50%, -60%) scale(0.8);
      }
      
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      
    }
  </style>
  
</head>

<body>
  
  <div class="header">
    S.K Bank Automatic Chart Dashboard
  </div>
  
  <div class="info" id="userInfo"></div>
  
  
  <!-- SINGLE DISPLAY CONTAINER -->
  <div class="chart-container active">
    <canvas id="mainChart"></canvas>
  </div>
  
  
  <script>
    // LOAD USER DATA
    let loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
    let users = JSON.parse(localStorage.getItem("skUsers")) || [];
    let transactions = JSON.parse(localStorage.getItem("skTransactions")) || [];
    
    let current = users.find(u => u.account === loggedUser.account);
    
    // SHOW USER INFO
    document.getElementById("userInfo").innerHTML =
      `
Name: ${current.fname} ${current.lname}<br>
Account: ${current.account}<br>
Balance: ₹${current.balance || 0}
`;
    
    
    // USER TRANSACTIONS
    let userTx = transactions.filter(t => t.account === current.account);
    
    
    // CALCULATE TOTALS
    let deposit = 0,
      withdraw = 0,
      transfer = 0;
    
    userTx.forEach(t => {
      
      if (t.type.includes("Deposit")) deposit += t.amount;
      if (t.type.includes("Withdraw")) withdraw += t.amount;
      if (t.type.includes("Transfer")) transfer += t.amount;
      
    });
    
    
    // DATA ARRAYS
    let labels = userTx.map(t => t.date);
    let amounts = userTx.map(t => t.amount);
    let balances = userTx.map(t => t.balance);
    
    
    // CHART TYPES LIST
    let chartList = [
      
      {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Transaction Amount',
            data: amounts,
            backgroundColor: 'green'
          }]
        }
      },
      
      {
        type: 'bar',
        data: {
          labels: ["Deposit", "Withdraw", "Transfer"],
          datasets: [{
            label: 'Amount',
            data: [deposit, withdraw, transfer],
            backgroundColor: ['green', 'red', 'blue']
          }]
        }
      },
      
      {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Balance Growth',
            data: balances,
            fill: true,
            backgroundColor: 'rgba(0,255,0,0.3)',
            borderColor: 'green'
          }]
        }
      },
      
      {
        type: 'doughnut',
        data: {
          labels: ["Deposit", "Withdraw", "Transfer"],
          datasets: [{
            data: [deposit, withdraw, transfer],
            backgroundColor: ['green', 'red', 'blue']
          }]
        }
      },
      
      {
        type: 'pie',
        data: {
          labels: ["Deposit", "Withdraw", "Transfer"],
          datasets: [{
            data: [deposit, withdraw, transfer],
            backgroundColor: ['green', 'red', 'blue']
          }]
        }
      },
      
      {
        type: 'bar',
        data: {
          labels: amounts,
          datasets: [{
            label: 'Histogram',
            data: amounts,
            backgroundColor: 'orange'
          }]
        }
      },
      
      {
        type: 'doughnut',
        data: {
          labels: ["Balance", "Remaining"],
          datasets: [{
            data: [current.balance, 100000 - current.balance],
            backgroundColor: ['green', 'gray']
          }]
        },
        options: {
          rotation: 270,
          circumference: 180
        }
      }
      
    ];
    
    
    // CREATE CHART
    let chartIndex = 0;
    
    let ctx = document.getElementById("mainChart");
    
    let chart = new Chart(ctx, chartList[0]);
    
    
    // AUTO CHANGE CHART EVERY 3 SECONDS
    setInterval(() => {
      
      chartIndex++;
      
      if (chartIndex >= chartList.length) {
        chartIndex = 0;
      }
      
      chart.destroy();
      
      chart = new Chart(ctx, chartList[chartIndex]);
      
    }, 3000);
  </script>
  
</body>

</html>
