<!DOCTYPE html>
<html>
<head>
<title>S.K Bank Advanced Charts</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.chart-box{
width:45%;
display:inline-block;
background:white;
color:black;
margin:10px;
padding:15px;
border-radius:10px;
}
</style>

</head>
<body>

<h2>S.K Bank Full Chart Dashboard</h2>

<div class="chart-box"><canvas id="columnChart"></canvas></div>
<div class="chart-box"><canvas id="clusterColumnChart"></canvas></div>
<div class="chart-box"><canvas id="stackedColumnChart"></canvas></div>
<div class="chart-box"><canvas id="barChart"></canvas></div>
<div class="chart-box"><canvas id="clusterBarChart"></canvas></div>
<div class="chart-box"><canvas id="stackedBarChart"></canvas></div>
<div class="chart-box"><canvas id="areaChart"></canvas></div>
<div class="chart-box"><canvas id="donutChart"></canvas></div>
<div class="chart-box"><canvas id="pieChart"></canvas></div>
<div class="chart-box"><canvas id="histogramChart"></canvas></div>
<div class="chart-box"><canvas id="gaugeChart"></canvas></div>
<div class="chart-box"><canvas id="liveChart"></canvas></div>

<script>

// Sample Data
let labels=["Jan","Feb","Mar","Apr","May"];
let approved=[12,19,8,15,10];
let pending=[5,7,3,6,4];


// COLUMN CHART
new Chart(columnChart,{
type:'bar',
data:{
labels:labels,
datasets:[{
label:'Approved',
data:approved,
backgroundColor:'green'
}]
}
});


// CLUSTERED COLUMN
new Chart(clusterColumnChart,{
type:'bar',
data:{
labels:labels,
datasets:[
{
label:'Approved',
data:approved,
backgroundColor:'green'
},
{
label:'Pending',
data:pending,
backgroundColor:'orange'
}
]
}
});


// STACKED COLUMN
new Chart(stackedColumnChart,{
type:'bar',
data:{
labels:labels,
datasets:[
{
label:'Approved',
data:approved,
backgroundColor:'green'
},
{
label:'Pending',
data:pending,
backgroundColor:'orange'
}
]
},
options:{
scales:{
x:{stacked:true},
y:{stacked:true}
}
}
});


// BAR CHART
new Chart(barChart,{
type:'bar',
data:{
labels:["Approved","Pending"],
datasets:[{
label:'Users',
data:[64,25],
backgroundColor:['green','orange']
}]
},
options:{
indexAxis:'y'
}
});


// CLUSTERED BAR
new Chart(clusterBarChart,{
type:'bar',
data:{
labels:labels,
datasets:[
{
label:'Approved',
data:approved,
backgroundColor:'green'
},
{
label:'Pending',
data:pending,
backgroundColor:'orange'
}
]
},
options:{
indexAxis:'y'
}
});


// STACKED BAR
new Chart(stackedBarChart,{
type:'bar',
data:{
labels:labels,
datasets:[
{
label:'Approved',
data:approved,
backgroundColor:'green'
},
{
label:'Pending',
data:pending,
backgroundColor:'orange'
}
]
},
options:{
indexAxis:'y',
scales:{
x:{stacked:true},
y:{stacked:true}
}
}
});


// AREA CHART
new Chart(areaChart,{
type:'line',
data:{
labels:labels,
datasets:[{
label:'Approved',
data:approved,
backgroundColor:'rgba(0,255,0,0.3)',
borderColor:'green',
fill:true
}]
}
});


// DONUT
new Chart(donutChart,{
type:'doughnut',
data:{
labels:["Approved","Pending"],
datasets:[{
data:[64,25],
backgroundColor:['green','orange']
}]
}
});


// PIE
new Chart(pieChart,{
type:'pie',
data:{
labels:["Approved","Pending"],
datasets:[{
data:[64,25],
backgroundColor:['green','orange']
}]
}
});


// HISTOGRAM
let histData=[2,4,5,7,8,10,12,13,15,18];

new Chart(histogramChart,{
type:'bar',
data:{
labels:histData,
datasets:[{
label:'Distribution',
data:histData,
backgroundColor:'blue'
}]
}
});


// GAUGE CHART (using doughnut)
new Chart(gaugeChart,{
type:'doughnut',
data:{
labels:["Used","Free"],
datasets:[{
data:[70,30],
backgroundColor:['red','gray']
}]
},
options:{
rotation:270,
circumference:180
}
});


// LIVE CHART
let liveLabels=[];
let liveData=[];

let liveChartObj=new Chart(liveChart,{
type:'line',
data:{
labels:liveLabels,
datasets:[{
label:'Live Users',
data:liveData,
borderColor:'cyan',
fill:false
}]
}
});

setInterval(()=>{
let time=new Date().toLocaleTimeString();

liveLabels.push(time);
liveData.push(Math.floor(Math.random()*100));

if(liveLabels.length>10){
liveLabels.shift();
liveData.shift();
}

liveChartObj.update();

},2000);


</script>

</body>
</html>
