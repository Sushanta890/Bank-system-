<!DOCTYPE html>
<html>
<head>
<title>SIM Enterprise 3D Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
    min-height:100vh;
    transition:0.4s;
}

/* DARK MODE */
body.dark{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    color:#fff;
}

.toggle-btn{
    padding:8px 15px;
    border:none;
    border-radius:20px;
    background:#fff;
    cursor:pointer;
    font-weight:bold;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.2);
    padding:20px;
    border-radius:20px;
    color:#fff;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

.chart-container{
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.15);
    padding:20px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

canvas{
    background:rgba(255,255,255,0.08);
    border-radius:15px;
    padding:10px;
}

.searchBox{
    padding:10px;
    border-radius:25px;
    border:none;
    width:250px;
    margin-bottom:15px;
}

.userCard{
    backdrop-filter:blur(10px);
    background:rgba(255,255,255,0.15);
    padding:15px;
    border-radius:15px;
    margin-bottom:10px;
    color:#fff;
}

button.approve{
    background:#00c853;
    color:white;
    padding:6px 12px;
    border:none;
    border-radius:15px;
    cursor:pointer;
}

.filters button{
    padding:6px 12px;
    margin:5px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    background:#ffffff33;
    color:#fff;
}
</style>
</head>
<body>

<div class="topbar">
    <h1>🚀 SIM Enterprise 3D Dashboard</h1>
    <button class="toggle-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
</div>

<div class="dashboard">
    <div class="card"><h3>Total Users</h3><h2 id="totalCount">0</h2></div>
    <div class="card"><h3>Approved</h3><h2 id="approvedCount">0</h2></div>
    <div class="card"><h3>Pending</h3><h2 id="pendingCount">0</h2></div>
    <div class="card"><h3>Total Revenue</h3><h2 id="totalRevenue">₹0</h2></div>
</div>

<div class="chart-container">
    <canvas id="trendChart"></canvas>
</div>

<div class="chart-container">
    <canvas id="revenue3DChart"></canvas>
</div>

<input type="text" class="searchBox" placeholder="Search SIM..." onkeyup="searchSIM(this.value)">

<div class="filters">
    <button onclick="filterUsers('All')">All</button>
    <button onclick="filterUsers('Approved')">Approved</button>
    <button onclick="filterUsers('Pending')">Pending</button>
</div>

<div id="userList"></div>

<script>
let trendChart,revenue3DChart,currentFilter="All";

function loadDashboard(){
    let users=JSON.parse(localStorage.getItem("users"))||[];
    let approved=users.filter(u=>u.status==="Approved");
    let pending=users.filter(u=>u.status==="Pending");

    document.getElementById("totalCount").innerText=users.length;
    document.getElementById("approvedCount").innerText=approved.length;
    document.getElementById("pendingCount").innerText=pending.length;

    let revenue=approved.reduce((sum,u)=>sum+(u.emi||0),0);
    document.getElementById("totalRevenue").innerText="₹"+revenue;

    displayUsers(users);
    load3DTrendChart(approved);
    load3DRevenueChart(approved);
}

function displayUsers(users){
    let container=document.getElementById("userList");
    container.innerHTML="";
    users.forEach((u,i)=>{
        if(currentFilter!=="All" && u.status!==currentFilter) return;
        container.innerHTML+=`
        <div class="userCard">
        <b>${u.fullName||"User"}</b><br>
        SIM: ${u.simNumber}<br>
        Status: ${u.status}<br>
        ${u.status==="Approved"&&u.emi?`EMI: ₹${u.emi}<br>`:""}
        ${u.status==="Pending"?`<button class="approve" onclick="approveUser(${i})">Approve</button>`:""}
        </div>`;
    });
}

function approveUser(i){
    let users=JSON.parse(localStorage.getItem("users"))||[];
    let emi=prompt("Enter EMI Amount:");
    if(!emi||isNaN(emi)) return;
    users[i].status="Approved";
    users[i].approvalDate=new Date().toISOString();
    users[i].emi=parseFloat(emi);
    localStorage.setItem("users",JSON.stringify(users));
    loadDashboard();
}

function filterUsers(status){currentFilter=status;loadDashboard();}
function searchSIM(val){
    let users=JSON.parse(localStorage.getItem("users"))||[];
    let f=users.filter(u=>u.simNumber.includes(val));
    displayUsers(f);
}

/* 3D LINE TREND */
function load3DTrendChart(approved){
    let ctx=document.getElementById("trendChart").getContext("2d");
    if(trendChart) trendChart.destroy();

    let labels=[],data=[];
    for(let i=6;i>=0;i--){
        let d=new Date();
        d.setDate(d.getDate()-i);
        let key=d.toISOString().split("T")[0];
        labels.push(key);
        data.push(approved.filter(u=>u.approvalDate?.includes(key)).length);
    }

    let gradient=ctx.createLinearGradient(0,0,0,400);
    gradient.addColorStop(0,"#00f5ff");
    gradient.addColorStop(1,"#0061ff");

    trendChart=new Chart(ctx,{
        type:"line",
        data:{labels:labels,datasets:[{
            label:"3D Approval Trend",
            data:data,
            borderColor:"#ffffff",
            backgroundColor:gradient,
            fill:true,
            tension:0.4,
            pointBackgroundColor:"#fff",
            pointRadius:5
        }]},
        options:{
            animation:{duration:2500,easing:"easeOutBounce"},
            plugins:{legend:{labels:{color:"#fff"}}},
            scales:{
                x:{ticks:{color:"#fff"}},
                y:{ticks:{color:"#fff"},beginAtZero:true}
            }
        }
    });
}

/* 3D REVENUE BAR */
function load3DRevenueChart(approved){
    let ctx=document.getElementById("revenue3DChart").getContext("2d");
    if(revenue3DChart) revenue3DChart.destroy();

    let monthly=new Array(12).fill(0);
    approved.forEach(u=>{
        if(u.emi){
            let m=new Date(u.approvalDate).getMonth();
            monthly[m]+=u.emi;
        }
    });

    let gradient=ctx.createLinearGradient(0,0,0,400);
    gradient.addColorStop(0,"#ff9966");
    gradient.addColorStop(1,"#ff5e62");

    revenue3DChart=new Chart(ctx,{
        type:"bar",
        data:{
            labels:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
            datasets:[{
                label:"3D Monthly Revenue",
                data:monthly,
                backgroundColor:gradient,
                borderRadius:12,
                borderSkipped:false
            }]
        },
        options:{
            animation:{duration:2500,easing:"easeOutElastic"},
            plugins:{legend:{labels:{color:"#fff"}}},
            scales:{
                x:{ticks:{color:"#fff"}},
                y:{ticks:{color:"#fff"},beginAtZero:true}
            }
        }
    });
}

function toggleDarkMode(){
    document.body.classList.toggle("dark");
    localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light");
}
if(localStorage.getItem("theme")==="dark") document.body.classList.add("dark");

loadDashboard();
</script>

</body>
</html>
