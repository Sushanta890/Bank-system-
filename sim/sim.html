<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home SIM System</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#2196f3,#00bcd4);
}

header{
    background:#0d47a1;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    letter-spacing:2px;
}

.container{
    width:95%;
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
    animation:fadeIn 1s ease-in-out;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

input, select, button{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:5px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    background:#2196f3;
    color:white;
    border:none;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0d47a1;
}

table{
    width:100%;
    margin-top:15px;
    border-collapse:collapse;
}

table, th, td{
    border:1px solid #ccc;
}

th, td{
    padding:8px;
    text-align:center;
}

th{
    background:#2196f3;
    color:white;
}

.search-box{
    margin-top:20px;
}
</style>
</head>
<body>

<header>📱 HOME SIM MANAGEMENT SYSTEM</header>

<div class="container">

<h3>SIM Registration</h3>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="mobile" placeholder="Mobile Number">
<select id="operator">
    <option value="">Select Operator</option>
    <option>Airtel</option>
    <option>Jio</option>
    <option>Vi</option>
    <option>BSNL</option>
</select>
<button onclick="addSim()">Register SIM</button>

<div class="search-box">
<h3>Search SIM</h3>
<input type="text" id="search" placeholder="Enter Mobile Number" onkeyup="searchSim()">
</div>

<h3>All SIM Records</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>Operator</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

</div>

<script>

let simData = JSON.parse(localStorage.getItem("simData")) || [];

function saveData(){
    localStorage.setItem("simData", JSON.stringify(simData));
}

function addSim(){
    let name = document.getElementById("name").value;
    let mobile = document.getElementById("mobile").value;
    let operator = document.getElementById("operator").value;

    if(name=="" || mobile=="" || operator==""){
        alert("Please fill all fields");
        return;
    }

    simData.push({name, mobile, operator});
    saveData();
    displayData();

    document.getElementById("name").value="";
    document.getElementById("mobile").value="";
    document.getElementById("operator").value="";
}

function displayData(){
    let table = document.getElementById("tableBody");
    table.innerHTML="";

    simData.forEach((data,index)=>{
        table.innerHTML += `
        <tr>
            <td>${data.name}</td>
            <td>${data.mobile}</td>
            <td>${data.operator}</td>
            <td><button onclick="deleteSim(${index})">Delete</button></td>
        </tr>`;
    });
}

function deleteSim(index){
    simData.splice(index,1);
    saveData();
    displayData();
}

function searchSim(){
    let searchValue = document.getElementById("search").value.toLowerCase();
    let rows = document.querySelectorAll("#tableBody tr");

    rows.forEach(row=>{
        let mobile = row.cells[1].textContent.toLowerCase();
        row.style.display = mobile.includes(searchValue) ? "" : "none";
    });
}

displayData();

</script>

</body>
</html>
