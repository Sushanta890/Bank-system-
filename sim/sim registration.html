<!DOCTYPE html>
<html>
<head>
<title>S.K SIM Registration</title>
<style>
body{
    font-family: Arial;
    background: linear-gradient(135deg,#1e90ff,#00c6ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}
.container{
    background:#fff;
    padding:25px;
    border-radius:12px;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
input, select{
    width:100%;
    padding:10px;
    margin:8px 0;
}
button{
    width:100%;
    padding:12px;
    background:#1e90ff;
    color:white;
    border:none;
    cursor:pointer;
}
button:hover{ background:#0d6efd; }
</style>
</head>
<body>

<div class="container">
<h2>S.K SIM Registration</h2>

<form onsubmit="register(event)">
<input type="text" id="fullName" placeholder="Full Name" required>
<input type="date" id="dob" required>

<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<input type="text" id="skNumber" placeholder="Enter S.K Card Number" required>

<button type="submit">Register</button>
</form>
</div>

<script>
function generateSIM(){
    return "9" + Math.floor(100000000 + Math.random() * 900000000);
}

function register(e){
    e.preventDefault();

    let users = JSON.parse(localStorage.getItem("users")) || [];

    let skNumber = document.getElementById("skNumber").value;

    if(users.some(user => user.skCardNumber === skNumber)){
        alert("S.K Card Number already registered!");
        return;
    }

    let simNumber;
    do{
        simNumber = generateSIM();
    }while(users.some(user => user.simNumber === simNumber));

    let newUser = {
        fullName: document.getElementById("fullName").value,
        dob: document.getElementById("dob").value,
        gender: document.getElementById("gender").value,
        skCardNumber: skNumber,
        simNumber: simNumber,
        status: "Pending"
    };

    users.push(newUser);
    localStorage.setItem("users", JSON.stringify(users));

    alert("Registration Submitted!\nWaiting for Approval.");
    document.querySelector("form").reset();
}
</script>

</body>
</html>
